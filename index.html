<html lang="en">

    <style>
        @font-face {
            font-family: 'TA Mizhav';
            src: local('TA Mizhav'), local('TAMizhav'), url('https://fonts.gstatic.com/s/anekmalayalam/v4/7Au3p_098iI61B2O4sB962C2xU9X22w.woff2') format('woff2');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --bg-color: #000000;
            --card-bg: #0a0a0a;
            --card-border: #1f1f1f;
            --primary-gold: #d4af37;
            --gold-hover: #f3e5ab;
            --accent-emerald: #10b981;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --font-portal-name: 'TA Mizhav', 'Cinzel', serif;
            --font-body: 'Montserrat', sans-serif;
            --font-arabic: 'Amiri', 'Cairo', serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: var(--font-body);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px 20px;
            border-bottom: 1px solid var(--card-border);
            position: relative;
        }

        .portal-brand {
            font-family: var(--font-portal-name);
            font-size: 2.6rem;
            color: var(--primary-gold);
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
            margin-bottom: 8px;
        }

        .college-title {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 1.3rem;
            color: var(--text-main);
            letter-spacing: 1.5px;
            margin-bottom: 6px;
        }

        .sub-tag {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 500;
        }

        .admin-nav-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #111;
            border: 1px solid var(--primary-gold);
            color: var(--primary-gold);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            font-family: var(--font-body);
            transition: all 0.3s ease;
        }

        .admin-nav-btn:hover {
            background: var(--primary-gold);
            color: #000;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .search-wrapper {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 35px 25px;
            margin: 40px auto;
            max-width: 650px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .search-title {
            font-family: var(--font-body);
            font-weight: 700;
            font-size: 1.4rem;
            color: var(--primary-gold);
            text-align: center;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        .form-control {
            width: 100%;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            padding: 14px 18px;
            border-radius: 8px;
            font-size: 1rem;
            font-family: var(--font-body);
            transition: border-color 0.3s;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary-gold);
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.2);
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #111;
            border: 1px solid var(--primary-gold);
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
        }

        .suggestion-item {
            padding: 12px 18px;
            cursor: pointer;
            border-bottom: 1px solid #222;
            transition: background 0.2s;
            font-weight: 500;
        }

        .suggestion-item:hover {
            background: #222;
            color: var(--primary-gold);
        }

        .btn-view-result {
            width: 100%;
            background: linear-gradient(135deg, #d4af37 0%, #aa820a 100%);
            color: #000;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-family: var(--font-body);
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            letter-spacing: 1px;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
            text-transform: uppercase;
        }

        .btn-view-result:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
        }

        .result-container {
            display: none;
            margin: 30px auto;
            max-width: 800px;
        }

        .marksheet-card {
            background: #080808;
            border: 2px solid var(--primary-gold);
            border-radius: 12px;
            padding: 40px;
            position: relative;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.15);
        }

        .marksheet-header {
            text-align: center;
            border-bottom: 2px dashed #333;
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .marksheet-header h2 {
            font-family: var(--font-portal-name);
            color: var(--primary-gold);
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .marksheet-header h3 {
            font-family: var(--font-body);
            color: #fff;
            font-size: 1.1rem;
            font-weight: 6
